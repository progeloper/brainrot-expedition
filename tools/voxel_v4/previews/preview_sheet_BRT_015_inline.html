// Voxel V4 design kit for new species (same conventions as the approved reference
// builds: design units, y up, nose/front = +x, z = left/right). Exports helpers and
// the anime-eye construction from the owner spec (section 2.4), measured against the
// approved BRT_019 eye so the proportions match exactly.
function createKit() {
	const R = 1, E = 4;
	const parts = [];
	let SLOT = 'Part';
	const S = (n) => { SLOT = n; };
	function B(x0, x1, y0, y1, z0, z1, role, flags = 0, col = null) {
		if (z0 > z1) [z0, z1] = [z1, z0];
		if (x0 > x1) [x0, x1] = [x1, x0];
		parts.push({ slot: SLOT, min: [x0, y0, z0], max: [x1, y1, z1], role, flags, col });
	}
	function MZ(x0, x1, y0, y1, z0, z1, role, flags, col) {
		B(x0, x1, y0, y1, z0, z1, role, flags, col);
		B(x0, x1, y0, y1, -z1, -z0, role, flags, col);
	}
	const IRIS = {
		Amber: ['#7a2a10', '#ff6a1a', '#ffcf45'], Ocean: ['#0b2e6b', '#1e8bff', '#7fe8ff'],
		Candy: ['#6b0f45', '#ff3da8', '#ffb3e0'], Lime: ['#1f4a0b', '#45d11e', '#c8ff6a'],
		Violet: ['#2e0f6b', '#8a4dff', '#d8b8ff'], Ruby: ['#5a0a14', '#f0283c', '#ff9aa5'],
	};
	// Front-facing anime eye on a panel whose face is at x = faceX (eye looks along +x).
	// u runs along z; `out` (+1/-1) is the outer side, which plays the role of the
	// side eye's "rear" (wing flick, big catchlight, blush). L/H are the eye panel.
	function frontEye({ faceX, zc, top, L, H, out, iris, lash = true, blush = true }) {
		const [dark, mid, bright] = IRIS[iris];
		const u = (a, b) => { const p = zc + out * a, q = zc + out * b; return [Math.min(p, q), Math.max(p, q)]; };
		const coreW = 0.48 * L, coreH = 0.67 * H, wideW = 0.58 * L, inset = 0.06 * H;
		const y0 = top - coreH, y1 = top;
		const d = (a, b) => [faceX + a, faceX + b];
		S('EyeWhite');
		B(...d(0, 0.04), y0, y1, ...u(-coreW / 2, coreW / 2), 'P', 0, '#ffffff');
		B(...d(0, 0.04), y0 + inset, y1 - inset, ...u(-wideW / 2, wideW / 2), 'P', 0, '#ffffff');
		// iris: 68% of white width x 84% of white height, bands bottom->top 27/33/40
		const iw = 0.68 * wideW, ih = 0.84 * coreH, ib = y0 + 0.042 * coreH;
		S('Iris');
		B(...d(0.04, 0.07), ib + 0.60 * ih, ib + ih, ...u(-iw / 2, iw / 2), 'P', 0, dark);
		B(...d(0.04, 0.07), ib + 0.27 * ih, ib + 0.60 * ih, ...u(-iw / 2, iw / 2), 'P', 0, mid);
		B(...d(0.04, 0.07), ib, ib + 0.27 * ih, ...u(-iw / 2, iw / 2), 'P', 0, bright);
		// pupil 49% x 47% of iris, centred, top 0.30 (scaled from the 2.45-unit head) below iris top
		const pw = 0.49 * iw, ph = 0.47 * ih, pTop = ib + ih - 0.30 * (H / 2.45);
		S('Pupil');
		B(...d(0.07, 0.1), pTop - ph, pTop, ...u(-pw / 2, pw / 2), 'P', 0, '#1a0b06');
		S('Catchlight');
		// big 38% x 28%, upper-outer overlapping the pupil corner
		const bw = 0.38 * iw, bh = 0.28 * ih, bTop = pTop + 0.16 * (H / 2.45);
		B(...d(0.1, 0.12), bTop - bh, bTop, ...u(iw / 2 - 0.1 * (L / 2.4) - bw, iw / 2 - 0.1 * (L / 2.4)), 'P', E, '#ffffff');
		// small 19% x 13%, lower-inner
		const sw = 0.19 * iw, sh = 0.13 * ih, sBottom = ib + 0.13 * ih;
		B(...d(0.1, 0.12), sBottom, sBottom + sh, ...u(-iw / 2 + 0.11 * (L / 2.4), -iw / 2 + 0.11 * (L / 2.4) + sw), 'P', E, '#ffffff');
		// sparkle 8% x 6%, upper-inner of the pupil
		const kw = 0.08 * iw, kh = 0.06 * ih, kTop = pTop - 0.14 * (H / 2.45);
		B(...d(0.1, 0.12), kTop - kh, kTop, ...u(-pw / 2 - 0.02, -pw / 2 - 0.02 + kw), 'P', E, '#ffffff');
		// upper lash 0.10H, overhanging both ends; wing flick up at the outer end; inner end droops
		const lashBottom = y1 - 0.08 * (H / 2.45), lashTop = lashBottom + 0.10 * H;
		if (lash) {
			S('Lash');
			B(...d(0, 0.14), lashBottom, lashTop, ...u(-wideW / 2 - 0.06, wideW / 2 + 0.08), 'P', 0, '#000000');
			B(...d(0, 0.14), lashTop - 0.11 * H, lashTop + 0.08 * H, ...u(wideW / 2 - 0.05, wideW / 2 + 0.12 * L + 0.03), 'P', 0, '#000000');
			B(...d(0, 0.14), lashBottom - 0.07 * H, lashBottom, ...u(-wideW / 2 - 0.1, -wideW / 2 + 0.1), 'P', 0, '#000000');
		}
		if (blush) {
			// blush 0.29L x 0.10H under the outer half
			S('Blush');
			B(...d(0, 0.04), y0 - 0.10 * H - 0.04, y0 - 0.04, ...u(0, 0.29 * L), 'P', E, '#ff6fa3');
		}
		// geometry for callers that build their own lids/brows
		return { lashTop: lashTop + 0.08 * H, bottom: y0 - 0.10 * H - 0.04, whiteTop: y1, whiteBottom: y0, pupilTop: pTop, inner: zc - out * wideW / 2, outer: zc + out * wideW / 2 };
	}
	return { parts, S, B, MZ, frontEye, R, E };
}
function skinFor(parts, PALETTES) {
	return (name) => {
		const p = PALETTES[name];
		return parts.map((b) => ({ min: b.min, max: b.max, flags: b.flags | (b.role !== 'P' ? 2 : 0), col: b.role === 'P' ? b.col : p[b.role] }));
	};
}
const GLOBAL_PALETTES = {
	shiny: { upper: '#FF87B7', lower: '#FFF4CD', stripe: '#FFFFFF', trim: '#FFE3EE', skin: '#FFE0EC', skin2: '#FFB6D3', feather: '#FF5FA0', feather2: '#FFFFFF', foot: '#FF9CC6', prop: '#FFF4CD', accent: '#FF87B7', mode: 5 },
	golden: { upper: '#D99510', lower: '#FFD447', stripe: '#FFF0A3', trim: '#FFE27A', skin: '#FFD447', skin2: '#E5A520', feather: '#8C4A08', feather2: '#FFF0A3', foot: '#D99510', prop: '#FFD447', accent: '#FFF0A3', mode: 1 },
	glitched: { upper: '#FF49E1', lower: '#2B0F52', stripe: '#3EFFF0', trim: '#5A1F9A', skin: '#FF8AF0', skin2: '#3EFFF0', feather: '#2B0F52', feather2: '#FF49E1', foot: '#3EFFF0', prop: '#FF49E1', accent: '#3EFFF0', mode: 4 },
	radioactive: { upper: '#DCFF2B', lower: '#182018', stripe: '#DCFF2B', trim: '#2A3A20', skin: '#C9FF5A', skin2: '#9FE01A', feather: '#182018', feather2: '#DCFF2B', foot: '#DCFF2B', prop: '#182018', accent: '#DCFF2B', mode: 2 },
	astral: { upper: '#6D74FF', lower: '#2A1F6E', stripe: '#EDE0FF', trim: '#3B2F8F', skin: '#C4B6FF', skin2: '#8F80FF', feather: '#140D38', feather2: '#EDE0FF', foot: '#6D74FF', prop: '#6D74FF', accent: '#EDE0FF', mode: 3 },
};
if (typeof module !== 'undefined') module.exports = { createKit, skinFor, GLOBAL_PALETTES };

// BRT_015 Strawberelli Flamingelli — Voxel V4 build (CP-B, Uncommon).
// Follows the accepted Studio sculpture (assets/BRT_015_Strawberelli_Flamingelli_Studio/, revision 4:
// Strawberelli_Preview.jpg, Strawberelli_Rear.jpg):
// - a sharp-edged, straight-paneled vivid scarlet strawberry torso (angular shoulder, straight middle,
//   pointed taper) with golden seeds
// - folded deep-green and lime calyx leaves on top
// - a long pale-pink S-shaped flamingo neck to a small head with huge amber-irised eyes (aligned
//   pupils), raised brows and a large ivory/black hooked beak
// - fanned wine-red wings and tail plumes
// - two slender hot-pink legs on oversized webbed feet (revision 3: a matching standing pair)
// Revision 2 (owner): less prominent brows (thin lash line, small brows), a thinner neck, longer legs.
// Revision 3 (owner): both legs match (a symmetric standing pair) so every model can be rigged later.
// V4 core rules: kit anime eyes (Amber; thin lash line, catchlights, blush) on eye domes, glowing Neon seeds,
// a light-up sole, studs on body panels only, dark joint collars. Dopamine palette.
// Design units, y up, front = +x.
const K = typeof module !== 'undefined' ? require('../kit.js') : { createKit, skinFor, GLOBAL_PALETTES };
const kit = K.createKit();
const { S, B, MZ, frontEye } = kit;
const R = 1, E = 4;
const parts = kit.parts;
const DARK = '#1D2133';
const INK = '#141018';

// angular octagon section (sharp panels) of half-size h
function sect(y0, y1, h, role, rel = R) {
	B(-h, h, y0, y1, -0.62 * h, 0.62 * h, role, rel);
	B(-0.62 * h, 0.62 * h, y0, y1, -h, h, role, rel);
}
function tube(a, b, r0, r1, role) {
	const L = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
	const n = Math.max(1, Math.ceil(L / 0.2));
	for (let k = 0; k < n; k++) {
		const t0 = k / n, t1 = (k + 1) / n, r = r0 + (r1 - r0) * (t0 + t1) / 2;
		const c0 = a.map((v, i) => v + (b[i] - v) * t0), c1 = a.map((v, i) => v + (b[i] - v) * t1);
		B(Math.min(c0[0], c1[0]) - r, Math.max(c0[0], c1[0]) + r, Math.min(c0[1], c1[1]) - r, Math.max(c0[1], c1[1]) + r,
			Math.min(c0[2], c1[2]) - r, Math.max(c0[2], c1[2]) + r, role, R);
	}
}

// --- sharp-edged strawberry torso: straight middle (the Body), angular shoulder, pointed taper
S('Body');
B(-0.74, 0.74, 1.45, 2.05, -0.74, 0.74, 'upper', R);
S('BerryPanels');
B(-0.88, 0.88, 1.5, 2.0, -0.5, 0.5, 'upper', R);
B(-0.5, 0.5, 1.5, 2.0, -0.88, 0.88, 'upper', R);
sect(2.05, 2.3, 0.66, 'upper');                                // angular shoulder
sect(1.1, 1.45, 0.56, 'upper');                                // taper
sect(0.82, 1.1, 0.32, 'upper');                                // pointed tip
// glowing golden seeds on the front and side panels
S('Seed');
for (const [y, z] of [[1.86, -0.3], [1.86, 0.3], [1.62, 0], [1.62, -0.56], [1.62, 0.56], [1.3, -0.24], [1.3, 0.24]]) {
	B(0.88, 0.92, y - 0.06, y + 0.06, z - 0.04, z + 0.04, 'stripe', E);
}
for (const s of [1, -1]) for (const [x, y] of [[-0.3, 1.8], [0.24, 1.6], [-0.2, 1.3]]) {
	B(x - 0.04, x + 0.04, y - 0.06, y + 0.06, 0.88 * s, 0.92 * s, 'stripe', E);
}

// --- folded deep-green and lime calyx leaves radiating from the top
S('Calyx');
B(-0.3, 0.3, 2.3, 2.42, -0.3, 0.3, 'feather', R);
for (const [dx, dz, role] of [[1, 0, 'feather2'], [-1, 0, 'feather'], [0, 1, 'feather2'], [0, -1, 'feather'], [0.71, 0.71, 'feather'], [-0.71, 0.71, 'feather2'], [-0.71, -0.71, 'feather2']]) {
	// long pointed leaf: wide base, narrower mid, tip, rising slightly outward
	for (const [r0, r1, w, y0] of [[0.3, 0.75, 0.2, 2.3], [0.75, 1.05, 0.12, 2.34], [1.05, 1.25, 0.06, 2.38]]) {
		const xa = dx * r0, xb = dx * r1, za = dz * r0, zb = dz * r1;
		const wx = Math.abs(dz) * w + 0.04, wz = Math.abs(dx) * w + 0.04;
		B(Math.min(xa, xb) - wx, Math.max(xa, xb) + wx, y0, y0 + 0.1, Math.min(za, zb) - wz, Math.max(za, zb) + wz, role, r0 < 0.5 ? R : 0);
	}
}

// --- long pale-pink S-shaped flamingo neck to a small head
S('Neck');
tube([0.0, 2.36, 0], [0.55, 2.8, 0], 0.11, 0.1, 'skin');
tube([0.55, 2.8, 0], [0.02, 3.3, 0], 0.1, 0.1, 'skin');
tube([0.02, 3.3, 0], [0.42, 3.74, 0], 0.1, 0.11, 'skin');
S('Head');
B(0.22, 0.76, 3.66, 4.18, -0.32, 0.32, 'skin', R);
// huge eye domes with front anime eyes (Amber), raised black brows
const FX = 0.84;
for (const out of [1, -1]) {
	S('EyeDome');
	B(0.46, FX, 3.84, 4.66, 0.02 * out, 0.52 * out, 'P', 0, '#FFFFFF');
	const eye = frontEye({ faceX: FX, zc: 0.27 * out, top: 4.6, L: 0.86, H: 1.06, out, iris: 'Amber', lash: false, blush: true });
	const z0 = Math.min(eye.inner, eye.outer), z1 = Math.max(eye.inner, eye.outer), zm = (z0 + z1) / 2;
	S('Lash');                                                  // thin lash line
	B(FX, FX + 0.05, eye.whiteTop - 0.01, eye.whiteTop + 0.035, z0 - 0.01, z1 + 0.01, 'P', 0, '#000000');
	const lift = out > 0 ? 0.05 : 0;                          // small, thin, slightly asymmetric brows
	S('Brow');
	B(0.5, FX + 0.04, eye.whiteTop + 0.08 + lift, eye.whiteTop + 0.12 + lift, zm - 0.12, zm + 0.12, 'P', 0, INK);
}
// large ivory/black hooked beak pointing forward and down
S('Beak');
B(0.76, 1.1, 3.6, 3.92, -0.17, 0.17, 'lower', R);
S('BeakTip');
B(1.02, 1.3, 3.38, 3.72, -0.15, 0.15, 'P', 0, INK);
B(1.12, 1.28, 3.26, 3.4, -0.09, 0.09, 'P', 0, INK);

// --- fanned wine-red wings on the flanks and spiky tail plumes at the back
for (const s of [1, -1]) {
	S('Wing');
	B(-0.62, 0.36, 1.56, 2.02, 0.88 * s, 0.96 * s, 'skin2', R);
	B(-0.78, 0.1, 1.68, 2.12, 0.94 * s, 1.0 * s, 'skin2');
}
S('TailPlume');
for (const [y, len] of [[1.66, 0.62], [1.86, 0.74], [2.06, 0.58]]) {
	B(-0.88 - len, -0.84, y, y + 0.12, -0.14, 0.14, 'skin2', R);
	B(-0.88 - len - 0.16, -0.88 - len, y + 0.02, y + 0.1, -0.06, 0.06, 'skin2');
}

// --- lift everything above so the flamingo stands on longer legs
const LIFT = 0.6;
for (const p of parts) { p.min[1] += LIFT; p.max[1] += LIFT; }

// --- matching pair of long slender hot-pink legs (symmetric, rig-ready), knee joints, webbed feet
S('HipCollar');
B(-0.16, 0.16, 1.36, 1.48, -0.34, 0.34, 'P', 0, DARK);
for (const s of [1, -1]) {
	const zc = 0.2 * s;
	S('Leg');
	tube([0.0, 1.44, zc], [0.06, 0.78, zc], 0.07, 0.06, 'prop');
	B(0.0, 0.14, 0.72, 0.84, zc - 0.07, zc + 0.07, 'P', 0, DARK);     // knee joint
	tube([0.07, 0.78, zc], [0.08, 0.12, zc], 0.06, 0.06, 'prop');
	S('Foot');                                                    // oversized webbed foot
	B(-0.12, 0.5, 0.04, 0.12, zc - 0.2, zc + 0.2, 'foot', R);
	S('Web');
	for (const dz of [-0.11, 0, 0.11]) B(0.1, 0.5, 0.12, 0.14, zc + dz - 0.015, zc + dz + 0.015, 'P', 0, '#E06AA6');
	S('Sole');
	B(-0.12, 0.5, 0, 0.04, zc - 0.2, zc + 0.2, 'accent', E);
}

// Dopamine high-contrast palette (docs/creatures/V4/BRT_015_reference.md); mutations use the global palettes.
const PALETTES = Object.assign(
	{ normal: { upper: '#FF1F3D', stripe: '#FFE14D', feather: '#0E8A3A', feather2: '#9BFF2E', skin: '#FF8FC8', skin2: '#8A0C2E', lower: '#FFF6D5', prop: '#FF2D95', foot: '#FFB3D9', accent: '#2EF2FF', mode: 0 } },
	K.GLOBAL_PALETTES,
);
const skin = K.skinFor(parts, PALETTES);
if (typeof module !== 'undefined') module.exports = { parts, PALETTES, skin };

function hex(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);}
function norm(v){const l=Math.hypot(...v);return v.map(x=>x/l);}
function sub(a,b){return a.map((x,i)=>x-b[i]);}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function lookAt(eye,t,up){const f=norm(sub(t,eye)),s=norm(cross(f,up)),u=cross(s,f);
 return [s[0],u[0],-f[0],0, s[1],u[1],-f[1],0, s[2],u[2],-f[2],0, -dot(s,eye),-dot(u,eye),dot(f,eye),1];}
function persp(fov,a,n,f){const t=1/Math.tan(fov/2);return [t/a,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0];}
function mul(a,b){const o=new Array(16).fill(0);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];return o;}

function buildMesh(boxes){
  const d=[];
  for(const b of boxes){
    const [x0,y0,z0]=b.min,[x1,y1,z1]=b.max,c=hex(b.col),fl=b.flags;
    const faces=[
      [[1,0,0],[[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],z1-z0,y1-y0],
      [[-1,0,0],[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],z1-z0,y1-y0],
      [[0,1,0],[[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]],x1-x0,z1-z0],
      [[0,-1,0],[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],x1-x0,z1-z0],
      [[0,0,1],[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],x1-x0,y1-y0],
      [[0,0,-1],[[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],x1-x0,y1-y0]];
    for(const [n,q,w,h] of faces){
      const uv=[[0,0],[w,0],[w,h],[0,h]];
      for(const i of [0,1,2,0,2,3]) d.push(...q[i],...n,...c,fl,...uv[i],w,h);
    }
  }
  return new Float32Array(d);
}

const VS=`#version 300 es
in vec3 p;in vec3 n;in vec3 c;in float fl;in vec2 fe;in vec2 fs;
uniform mat4 mvp;
out vec3 vp;out vec3 vn;out vec3 vc;flat out float vf;out vec2 vfe;flat out vec2 vfs;
void main(){vp=p;vn=n;vc=c;vf=fl;vfe=fe;vfs=fs;gl_Position=mvp*vec4(p,1.);}`;
const FS=`#version 300 es
precision highp float;
in vec3 vp;in vec3 vn;in vec3 vc;flat in float vf;in vec2 vfe;flat in vec2 vfs;
uniform vec3 eye;uniform int mode;uniform int glow;out vec4 o;
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec3 lin(vec3 c){return pow(c,vec3(2.2));}
void main(){
  int f=int(vf+.5);bool relief=(f&1)!=0;bool mutable=(f&2)!=0;bool emis=(f&4)!=0;
  vec3 N=normalize(vn);vec3 U,V;vec2 uv;
  vec3 a=abs(N);
  if(a.x>.5){U=vec3(0,0,1);V=vec3(0,1,0);uv=vp.zy;}else if(a.y>.5){U=vec3(1,0,0);V=vec3(0,0,1);uv=vp.xz;}else{U=vec3(1,0,0);V=vec3(0,1,0);uv=vp.xy;}
  float tile=.5;vec2 tid=floor(uv/tile+.001);vec2 g=fract(uv/tile+.001);
  vec3 base=lin(vc);float spec=.22;float sp=40.;vec3 em=vec3(0);
  if(relief){vec2 q=g-.5;float dd=max(abs(q.x),abs(q.y));
    if(dd<.24){ if(dd>.17){vec3 pn=abs(q.x)>abs(q.y)?sign(q.x)*U:sign(q.y)*V;N=normalize(N+pn*.9);} else base*=1.06; }
    else base*=.94;}
  if(mutable&&mode!=0){
    float hh=h21(tid+floor(vp.z*2.)*3.1);
    if(mode==1){base*=(.82+.32*hh);spec=1.1;sp=55.;}
    else if(mode==2){base*=(.85+.25*hh);em=base*.22;}
    else if(mode==3){base*=(.85+.2*hh);float s=h21(tid+7.);if(relief&&s>.8&&length(g-.5)<.16)em=vec3(1.,.95,1.)*1.6;spec=.5;}
    else if(mode==4){if(relief&&hh<.42)base=lin(vec3(.24,1.,.94));else if(relief&&hh>.93)base=vec3(1.);em=base*.12;}
    else if(mode==5){spec=.9;sp=30.;float s=h21(tid+3.);if(relief&&s>.88&&length(g-.5)<.12)em=vec3(1.,.9,.95)*1.3;}
  }
  // crisp edge darkening
  vec2 ed=min(vfe,vfs-vfe);float e=min(ed.x,ed.y);
  float edge=mix(.72,1.,smoothstep(0.,.06,e));
  vec3 L1=normalize(vec3(.75,1.25,-.95)),L2=normalize(vec3(-.7,.45,-1.)),Vd=normalize(eye-vp);
  float d1=max(dot(N,L1),0.),d2=max(dot(N,L2),0.);
  float hemi=.5+.5*N.y;
  vec3 amb=mix(lin(vec3(.62,.55,.6)),lin(vec3(.86,.92,1.)),hemi)*.30;
  vec3 col=base*(amb+vec3(1.,.97,.92)*d1*1.15+lin(vec3(.75,.85,1.))*d2*.35);
  float s1=pow(max(dot(N,normalize(L1+Vd)),0.),sp)*spec;col+=vec3(s1)*(mode==1&&mutable?lin(vec3(1.,.85,.4)):vec3(1.));
  float rim=pow(1.-max(dot(N,Vd),0.),3.);col+=rim*(mode==3&&mutable?vec3(.6,.55,1.):vec3(.25,.3,.4))*.35;
  col*=mix(.78,1.,clamp(vp.y/1.6,0.,1.));
  col*=edge;
  if(emis)col=base*1.25+base*.25;
  col+=em;
  if(glow==1){vec3 gcol=emis?base*1.4:em;o=vec4(pow(clamp(gcol,0.,1.),vec3(1./2.2)),1.);return;}
  col=col/(col+vec3(.85))*1.55;
  o=vec4(pow(clamp(col,0.,1.),vec3(1./2.2)),1.);
}`;
function render(canvas,boxes,opts){
  const gl=canvas.getContext('webgl2',{antialias:true,alpha:true,premultipliedAlpha:false});
  function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x;}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
  const data=buildMesh(boxes);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
  const st=14*4;let off=0;
  for(const [nm,sz] of [['p',3],['n',3],['c',3],['fl',1],['fe',2],['fs',2]]){const l=gl.getAttribLocation(pr,nm);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,sz,gl.FLOAT,false,st,off);off+=sz*4;}
  // pad: we pushed 14 floats; fix stride below
  const eye=opts.eye,tgt=opts.target;
  const m=mul(persp(opts.fov,canvas.width/canvas.height,.1,100),lookAt(eye,tgt,[0,1,0]));
  gl.uniformMatrix4fv(gl.getUniformLocation(pr,'mvp'),false,m);
  gl.uniform3fv(gl.getUniformLocation(pr,'eye'),eye);gl.uniform1i(gl.getUniformLocation(pr,'mode'),opts.mode||0);gl.uniform1i(gl.getUniformLocation(pr,'glow'),opts.glow?1:0);
  gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(0,0,0,opts.glow?1:0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);
  gl.drawArrays(gl.TRIANGLES,0,data.length/14);
}
